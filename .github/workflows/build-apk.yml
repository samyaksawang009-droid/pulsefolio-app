name: Build PulseFolio Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Debug Keystore for Firebase Google Sign-In
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare PulseFolio.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk PulseFolio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseFolio-APK
          path: PulseFolio.apk

      - name: Publish Direct Download Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PulseFolio Android APK (Build #${{ github.run_number }})"
          body: |
            ### 📱 PulseFolio Android App — Direct Mobile Install
            Neeche **Assets** mein **`PulseFolio.apk`** par tap karke seedha apne Android phone mein download aur install karein!
          files: PulseFolio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
